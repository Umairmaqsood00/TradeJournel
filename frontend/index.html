<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeVault - Professional Trading Journal &amp; Analytics Desk</title>

    <!-- Chrome, Safari, Firefox Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#090A0C" />

    <!-- Core SEO Meta Tags -->
    <meta name="description" content="TradeVault is an enterprise-grade private trading journal and analytics platform. Track trade executions, analyze win rates, calculate net P&amp;L, manage risk, and audit trading discipline." />
    <meta name="keywords" content="TradeVault, trading journal, trade tracker, crypto trading desk, forex trading journal, stock trading log, risk management, win rate calculator, trader performance analytics" />
    <meta name="author" content="TradeVault Team" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://tradevault.app/" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TradeVault" />
    <meta property="og:title" content="TradeVault - Professional Trading Journal &amp; Analytics Desk" />
    <meta property="og:description" content="Secure, high-performance trading desk for execution tracking, risk management, and discipline auditing." />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:url" content="https://tradevault.app/" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeVault - Professional Trading Journal" />
    <meta name="twitter:description" content="Secure, high-performance trading desk for execution tracking, risk management, and discipline auditing." />
    <meta name="twitter:image" content="/favicon.png" />

    <!-- GEO & Localized SEO Meta Tags -->
    <meta name="geo.region" content="US-NY" />
    <meta name="geo.placename" content="New York" />
    <meta name="geo.position" content="40.7128;-74.0060" />
    <meta name="ICBM" content="40.7128, -74.0060" />

    <!-- Structured Data (JSON-LD) for SEO & AI Search Engines (GEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TradeVault",
      "operatingSystem": "All",
      "applicationCategory": "FinanceApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Enterprise-grade private trading journal, risk management, and performance analytics vault for crypto, forex, and stock traders.",
      "publisher": {
        "@type": "Organization",
        "name": "TradeVault Inc.",
        "url": "https://tradevault.app"
      }
    }
    </script>

    <!-- Google Fonts: Inter, JetBrains Mono & IBM Plex Mono (Binance Style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090A0C] text-[#f0f1f4] antialiased selection:bg-emerald-500/20 selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
